<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <nav class="timeline-nav" aria-label="Site sections">
    <div class="timeline-nav__inner">
      <a href="{{ '/' | relative_url }}" class="timeline-nav__brand">
        <span class="timeline-nav__brand-line timeline-nav__brand-line--accent">Michael</span>
        <span class="timeline-nav__brand-line timeline-nav__brand-line--base">Falcione</span>
      </a>
      <div class="timeline-track" id="timelineTrack">
        <a href="#reel" class="timeline-clip" data-target="reel">
          <span class="tc-label">Reel</span>
        </a>
        <a href="#work" class="timeline-clip" data-target="work">
          <span class="tc-label">Work</span>
        </a>
        <a href="#skills" class="timeline-clip" data-target="skills">
          <span class="tc-label">Skills</span>
        </a>
        <a href="#about" class="timeline-clip" data-target="about">
          <span class="tc-label">About</span>
        </a>
        <a href="#contact" class="timeline-clip" data-target="contact">
          <span class="tc-label">Contact</span>
        </a>
        <div class="timeline-playhead" id="timelinePlayhead"></div>
      </div>
      <button class="track2-toggle" id="track2Toggle" type="button" aria-expanded="false" aria-controls="track2Panel" aria-label="Show more creative work">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>
  </nav>

  <div class="track2-panel" id="track2Panel">
    <div class="track2-panel__inner">
      <span class="track2-panel__label">Track 02</span>
      <div class="track2-track" id="track2Track">
        <a href="{{ '/graphic-design/' | relative_url }}" class="timeline-clip">Graphic Design</a>
        <a href="{{ '/motion-design/' | relative_url }}" class="timeline-clip">Motion Design</a>
        <a href="{{ '/photography/' | relative_url }}" class="timeline-clip">Photography</a>
        <div class="track2-playhead" id="track2Playhead"></div>
      </div>
    </div>
  </div>

  <main>
    {{ content }}
  </main>

  <footer>
    <p class="tc">&copy; {{ 'now' | date: "%Y" }} {{ site.author }} — cut on {{ 'now' | date: "%m.%d.%y" }}</p>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
