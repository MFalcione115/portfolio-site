<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <nav class="timeline-nav" aria-label="Track 2 navigation">
    <div class="timeline-nav__inner">
      <a href="{{ '/' | relative_url }}" class="timeline-nav__brand">
        <span class="timeline-nav__brand-line timeline-nav__brand-line--accent">Michael</span>
        <span class="timeline-nav__brand-line timeline-nav__brand-line--base">Falcione</span>
      </a>
      <div class="timeline-track" id="track2Track">
        <a href="{{ '/graphic-design/' | relative_url }}" class="timeline-clip{% if page.url == '/graphic-design/' %} is-active{% endif %}">Graphic Design</a>
        <a href="{{ '/motion-design/' | relative_url }}" class="timeline-clip{% if page.url == '/motion-design/' %} is-active{% endif %}">Motion Design</a>
        <a href="{{ '/photography/' | relative_url }}" class="timeline-clip{% if page.url == '/photography/' %} is-active{% endif %}">Photography</a>
        <div class="track2-playhead" id="track2Playhead"></div>
      </div>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <p class="tc">&copy; {{ 'now' | date: "%Y" }} {{ site.author }} — cut on {{ 'now' | date: "%m.%d.%y" }}</p>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
